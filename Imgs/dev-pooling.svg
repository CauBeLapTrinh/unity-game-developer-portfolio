<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a16" />
      <stop offset="50%" stop-color="#140e2d" />
      <stop offset="100%" stop-color="#080811" />
    </linearGradient>
    <radialGradient id="greenGlow" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow2" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="csharpHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2e1065" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad2)" />
  <rect width="600" height="400" fill="url(#gridPattern2)" />
  <circle cx="180" cy="190" r="180" fill="url(#greenGlow)" />
  <circle cx="440" cy="190" r="180" fill="url(#purpleGlow2)" />

  <!-- Top Badges -->
  <rect x="36" y="28" width="180" height="26" rx="13" fill="#1e1338" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
  <circle cx="50" cy="41" r="4" fill="#c084fc" />
  <text x="62" y="45" fill="#c084fc" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="1">C# MEMORY POOLING</text>

  <rect x="406" y="28" width="158" height="26" rx="13" fill="#064e3b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8" />
  <circle cx="420" cy="41" r="4" fill="#34d399" />
  <text x="432" y="45" fill="#34d399" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="1">0 B/FRAME ALLOC</text>

  <!-- LEFT: Circular Pool Lifecycle Diagram -->
  <g transform="translate(180, 190)">
    <!-- Outer dashed recycling circle -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8,6" filter="url(#glow2)" />
    
    <!-- Central Recycle Icon -->
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <path d="M -16,-6 C -10,-20 10,-20 18,-6 L 14,-6 M 18,-6 L 18,-16" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 16,6 C 10,20 -10,20 -18,6 L -14,6 M -18,6 L -18,16" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="900" text-anchor="middle">POOL</text>

    <!-- Get() pill -->
    <rect x="-92" y="-14" width="48" height="28" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="-68" y="4" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">Get()</text>

    <!-- Release() pill -->
    <rect x="44" y="-14" width="62" height="28" rx="6" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5" />
    <text x="75" y="4" fill="#e9d5ff" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">Release()</text>

    <!-- Labels -->
    <text x="0" y="-90" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ACTIVE ENTITY (IN-WORLD)</text>
    <text x="0" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DORMANT QUEUE (ZERO-GC)</text>
  </g>

  <!-- RIGHT: Memory Slots Buffer + C# Emblem -->
  <g transform="translate(420, 190)">
    <!-- Memory Slots Header -->
    <text x="50" y="-68" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">PRE-ALLOCATED BUFFER</text>
    
    <!-- Slots row 1 -->
    <rect x="-20" y="-50" width="34" height="34" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="-3" y="-28" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">01</text>
    
    <rect x="22" y="-50" width="34" height="34" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="39" y="-28" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">02</text>

    <rect x="64" y="-50" width="34" height="34" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="81" y="-28" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">03</text>

    <rect x="106" y="-50" width="34" height="34" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="123" y="-28" fill="#a5b4fc" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">..</text>

    <!-- Slots row 2 -->
    <rect x="-20" y="-8" width="34" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="-3" y="14" fill="#64748b" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">N</text>

    <rect x="22" y="-8" width="34" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="39" y="14" fill="#64748b" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">N</text>

    <rect x="64" y="-8" width="34" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="81" y="14" fill="#64748b" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">N</text>

    <rect x="106" y="-8" width="34" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="123" y="14" fill="#64748b" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">N</text>

    <!-- FPS Meter & Stats -->
    <rect x="-20" y="44" width="160" height="42" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="-4" cy="65" r="5" fill="#bef264" filter="url(#glow2)" />
    <text x="10" y="62" fill="#bef264" font-family="'Courier New', monospace" font-size="13" font-weight="bold">60.0 FPS</text>
    <text x="10" y="77" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold">ZERO GC SPIKES</text>
  </g>

  <!-- Bottom Tech Footer Bar -->
  <rect x="40" y="338" width="520" height="34" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
  <text x="56" y="359" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">PATTERN:</text>
  <text x="120" y="359" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="700">UnityEngine.Pool.ObjectPool&lt;T&gt;</text>
  <text x="350" y="359" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">TARGET:</text>
  <text x="408" y="359" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">Low-End Android / iOS Devices</text>
</svg>
